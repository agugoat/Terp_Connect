{% extends "base.html" %}

<html>
    <h1>
        Clubs
    </h1>
    <body>
        This is a place for UMD clubs
    </body>
    <ul>
    {% for club in clubs %}
        <li>
            <h2>{{ club.name }}</h2>
            <p><strong>Category:</strong> {{ club.category }}</p>
            <p><strong>Contact:</strong> {{ club.contact }}</p>
            <p><strong>Description:</strong> {{ club.desc }}</p>
            <p><strong>Tags:</strong> {{ club.tags | join(", ") }}</p>
        </li>
    {% endfor %}
</ul>
</html>
