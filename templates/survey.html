<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TerpConnect — Club Interest Survey</title>
  <style>
    :root{
      --umd-red:#e21833;
      --umd-gold:#ffd200;
      --umd-black:#000000;
    }
    body{
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin:0;
      background:#faf9f6;
      color:#222;
    }
    header{
      background:var(--umd-red);
      color:white;
      padding:40px 20px;
      text-align:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }
    h1{
      margin:0;
      font-size:2rem;
      font-weight:700;
      letter-spacing:1px;
    }
    .subtext{
      font-size:1.1rem;
      margin-top:8px;
    }
    .container{
      max-width:820px;
      background:white;
      margin:30px auto;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.1);
      border-top:10px solid var(--umd-gold);
    }
    fieldset{
      border:2px solid var(--umd-red);
      padding:20px;
      border-radius:10px;
      margin-top:20px;
      background:#fff7f8;
    }
    legend{
      font-weight:700;
      color:var(--umd-red);
      padding:0 6px;
      font-size:1.2rem;
    }
    label{
      cursor:pointer;
      font-size:1rem;
    }
    .choices label{
      padding:10px;
      background:#ffffff;
      border:1px solid #ddd;
      border-radius:6px;
      display:flex;
      align-items:center;
      gap:10px;
      transition:0.15s ease;
    }
    .choices label:hover{
      background:#fff1f1;
      border-color:var(--umd-red);
    }
    input[type="checkbox"]{
      width:18px;
      height:18px;
      accent-color:var(--umd-red);
    }
    #other{
      width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;
      margin-top:6px;
      font-size:1rem;
    }
    button{
      margin-top:24px;
      padding:12px 20px;
      border-radius:8px;
      border:none;
      background:var(--umd-red);
      color:white;
      font-size:1.1rem;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      transition:background 0.2s ease;
    }
    button:hover{
      background:#b31227;
    }
    a{
      color:var(--umd-red);
      text-decoration:none;
      font-weight:600;
    }
    a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1>TerpConnect Club Interest Survey</h1>
    <p class="subtext">Show us what UMD communities you vibe with!</p>
  </header>

  <div class="container">
    <main id="main" tabindex="-1">
      <form method="post" action="/survey" novalidate>

        <fieldset>
          <legend>Choose your clubs</legend>
          <div class="choices">
            <label>
              <input type="checkbox" name="clubs[]" value="1" />
              <strong>UMD Soccer Club</strong> — Casual/competitive soccer for all skill levels.
            </label>

            <label>
              <input type="checkbox" name="clubs[]" value="2" />
              <strong>HackUMD</strong> — Hackathons, workshops, and weekly coding meetups.
            </label>

            <label>
              <input type="checkbox" name="clubs[]" value="3" />
              <strong>UMD Archery Club</strong> — Training, competitions, and beginner-friendly archery.
            </label>
          </div>
        </fieldset>

        <div style="margin-top:20px;">
          <label for="other"><strong>Interested in another organization?</strong></label>
          <input id="other" name="other" type="text" placeholder="Type any additional clubs here..." />
        </div>

        <button type="submit">Submit Survey</button>
      </form>

      <p style="margin-top:20px; text-align:center;">
        <a href="/">Return to homepage</a>
      </p>
    </main>
  </div>
</body>
</html>


{% extends "base.html" %}
